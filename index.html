<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font-family: Arial, sans-serif; color: #222; background: #fff; }
    h3 { margin: 0 0 12px 0; font-size: 18px; }
    .row { border: 1px solid #ddd; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    input, select, button { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border-radius: 8px; }
    input, select { border: 1px solid #bbb; background: #fff; }
    .results { border: 1px solid #ddd; border-radius: 8px; margin-top: 5px; overflow: hidden; }
    .result { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; line-height: 1.35; }
    .result:last-child { border-bottom: 0; }
    .result:hover { background: #f5f5f5; }
    .chosen { background: #f7f7f7; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
    .controls { display: flex; gap: 8px; margin-top: 8px; }
    .controls > div { flex: 1; min-width: 0; }
    small { display: block; margin-bottom: 4px; font-weight: bold; }
    .add { border: 1px solid #888; background: #fff; font-weight: bold; cursor: pointer; }
    .remove { width: auto; border: 0; background: transparent; color: #b00020; font-size: 13px; padding: 6px 0; cursor: pointer; }
    .hint { margin-top: 8px; color: #666; font-size: 12px; }
    .manual { margin-top: 6px; border: 1px solid #888; background: #f7f7f7; font-weight: bold; cursor: pointer; }
    .status { margin-top: 8px; color: #666; font-size: 13px; line-height: 1.35; }
  </style>
</head>
<body>
  <h3>RICAMBI UTILIZZATI</h3>
  <div id="rows"></div>
  <button type="button" class="add" id="add">+ Aggiungi ricambio</button>
  <div class="hint">Cerca per codice commerciale o descrizione. Se non trovi il ricambio, puoi usare la descrizione manuale. Il codice interno RAT-xxxx non viene mostrato.</div>

<script>
const UNITS = ['pezzi', 'cm', 'litri', 'Kg'];
const rows = [];
const root = document.getElementById('rows');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function addRow() {
  rows.push({
    id: Date.now() + Math.random(),
    q: '',
    results: [],
    selected: null,
    unit: 'pezzi',
    qty: '',
    searching: false,
    searchError: false
  });
  render();
}

function getOutput() {
  return {
    ricambi_utilizzati: rows
      .filter(r => r.selected && String(r.selected.description || '').trim())
      .map(r => ({
        COD_RICAMBIO: r.selected.code || '',
        Ricambi: String(r.selected.description || '').trim(),
        unita_misura: r.unit,
        quantita_utilizzata: r.qty === '' ? '' : Number(r.qty),
        Origine: r.selected.manual ? 'MANUALE' : 'ANAGRAFICA'
      }))
  };
}

function sendData() {
  if (window.JFCustomWidget) {
    JFCustomWidget.sendData({ value: JSON.stringify(getOutput()) });
  }
}

async function search(row, value) {
  row.q = value;
  row.selected = null;
  row.searchError = false;

  if (!value.trim()) {
    row.results = [];
    row.searching = false;
    render();
    sendData();
    return;
  }

  row.searching = true;
  render();

  try {
    const API = 'https://script.google.com/macros/s/AKfycby_QAET2KqQB_Rq_VFC0SOHIVenJCcunLWPFVgz6CipZXTad1c63I0--O3ZY7Rh3Fsziw/exec';
    const url = API + '?q=' + encodeURIComponent(value.trim());
    const response = await fetch(url);
    const data = await response.json();

    // Ignora una risposta vecchia se nel frattempo la ricerca è cambiata.
    if (row.q !== value) return;

    row.results = data.ok ? data.results : [];
  } catch (error) {
    if (row.q !== value) return;
    row.results = [];
    row.searchError = true;
  } finally {
    if (row.q === value) {
      row.searching = false;
      render();
    }
  }
}

function selectResult(row, item) {
  row.selected = {
    code: item.code || '',
    description: item.description || '',
    masterUnit: item.unit || '',
    manual: false
  };
  row.q = '';
  row.results = [];
  row.searching = false;
  if (UNITS.includes(item.unit)) row.unit = item.unit;
  render();
  sendData();
}

function selectManual(row) {
  const description = String(row.q || '').trim();
  if (!description) return;

  row.selected = {
    code: '',
    description: description,
    masterUnit: '',
    manual: true
  };
  row.q = '';
  row.results = [];
  row.searching = false;
  row.searchError = false;
  render();
  sendData();
}

function render() {
  root.innerHTML = rows.map((row, index) => `
    <div class="row" data-index="${index}">
      ${row.selected ? `
        <div class="chosen">
          <strong>${esc(row.selected.description)}</strong>
          ${row.selected.manual ? '<div class="status">Ricambio inserito manualmente</div>' : ''}
        </div>
        <div class="controls">
          <div>
            <small>Unità di misura</small>
            <select class="unit">
              ${UNITS.map(unit => `<option value="${unit}" ${row.unit === unit ? 'selected' : ''}>${unit}</option>`).join('')}
            </select>
          </div>
          <div>
            <small>Quantità utilizzata</small>
            <input class="qty" type="number" min="0" step="any" inputmode="decimal" value="${esc(row.qty)}">
          </div>
        </div>
      ` : `
        <input class="search" type="search" autocomplete="off" placeholder="Cerca ricambio per codice o descrizione..." value="${esc(row.q)}">
        ${row.searching ? '<div class="status">Ricerca in corso…</div>' : ''}
        ${row.results.length ? `
          <div class="results">
            ${row.results.map((item, resultIndex) => `
              <div class="result" data-result="${resultIndex}">${esc(item.description)}</div>
            `).join('')}
          </div>
        ` : ''}
        ${row.q.trim() && !row.searching && !row.results.length ? `
          <button type="button" class="manual">Usa «${esc(row.q.trim())}» come descrizione manuale</button>
          <div class="status">${row.searchError ? 'Ricerca non riuscita. Puoi comunque registrare la descrizione manualmente.' : 'Nessun ricambio trovato. Puoi registrare il testo inserito come descrizione manuale.'}</div>
        ` : ''}
      `}
      ${rows.length > 1 ? `<button type="button" class="remove">Rimuovi ricambio</button>` : ''}
    </div>
  `).join('');

  root.querySelectorAll('.row').forEach(function(container, index) {
    const row = rows[index];
    const searchInput = container.querySelector('.search');

    if (searchInput) {
      let timer;
      searchInput.addEventListener('input', function(event) {
        clearTimeout(timer);
        const value = event.target.value;
        row.q = value;
        row.results = [];
        row.searching = false;
        row.searchError = false;
        timer = setTimeout(function() { search(row, value); }, 180);
      });
    }

    container.querySelectorAll('.result').forEach(function(element) {
      element.addEventListener('click', function() {
        const resultIndex = Number(element.dataset.result);
        selectResult(row, row.results[resultIndex]);
      });
    });

    const manual = container.querySelector('.manual');
    if (manual) manual.addEventListener('click', function() {
      selectManual(row);
    });

    const unit = container.querySelector('.unit');
    if (unit) unit.addEventListener('change', function(event) {
      row.unit = event.target.value;
      sendData();
    });

    const qty = container.querySelector('.qty');
    if (qty) qty.addEventListener('input', function(event) {
      row.qty = event.target.value;
      sendData();
    });

    const remove = container.querySelector('.remove');
    if (remove) remove.addEventListener('click', function() {
      rows.splice(index, 1);
      if (!rows.length) addRow();
      render();
      sendData();
    });
  });
}

document.getElementById('add').addEventListener('click', function() {
  addRow();
  sendData();
});

addRow();

if (window.JFCustomWidget) {
  JFCustomWidget.subscribe('ready', function() {
    sendData();
  });

  JFCustomWidget.subscribe('submit', function() {
    const output = getOutput();
    JFCustomWidget.sendData({ value: JSON.stringify(output) });
    JFCustomWidget.sendSubmit({
      valid: true,
      value: JSON.stringify(output)
    });
  });
}
</script>
</body>
</html>
